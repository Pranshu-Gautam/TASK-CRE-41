# TASK-CRE-41 — local, reproducible execution environment.
# Two services only: the PostGIS database and the pipeline image.
# Deliberately boring: no orchestrator, no queue, no extra moving parts.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: iris-cre41-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iris_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-iris}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - iris_cre41_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iris} -d ${POSTGRES_DB:-iris}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build: .
    image: iris-cre41-pipeline:latest
    container_name: iris-cre41-pipeline
    # Run as the host user so the bind-mounted ./data and ./samples stay
    # writable and the files it writes are owned by you, not by root.
    # Override with `APP_UID=$(id -u) APP_GID=$(id -g)` if your ids differ.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable as "db:5432".
      DB_URI: "postgresql+psycopg://${POSTGRES_USER:-iris}:${POSTGRES_PASSWORD:-iris_local_dev_only}@db:5432/${POSTGRES_DB:-iris}"
      IRIS_USER_AGENT: "${IRIS_USER_AGENT:-IRIS-Wave4-TASK-CRE-41/1.0 (Project IRIS Wave 4 technical assessment; contact via submission repository)}"
      IRIS_GEOCODER: ${IRIS_GEOCODER:-nominatim}
      IRIS_STAGING_SCHEMA: ${IRIS_STAGING_SCHEMA:-iris_staging}
    volumes:
      - ./data:/app/data
      - ./samples:/app/samples
    # Default command only initialises the schema; the real runs are explicit
    # (see README). This keeps `compose up` side-effect-free w.r.t. live sites.
    command: ["iris-cre41", "init-db"]

volumes:
  iris_cre41_pgdata:
